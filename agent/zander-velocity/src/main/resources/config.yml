config-version: 1

BaseAPIURL: "http://localhost:8080/api"
APIKey: "KEY"

announcementMOTDTopLine: "&e&lMy &2&nMinecraft&r &6&oServer"
announcementTipPrefix: "&7&l[&6&lTIP&7&l]&r "
announcementTipInterval: 10

hub-bridge:
  enabled: true
  channel: "zander:hub"
  allowed-source-servers:
    - hub
  rate-limit:
    connection-request-cooldown-ms: 1500
  logging:
    malformed-messages: true
    denied-source-servers: true