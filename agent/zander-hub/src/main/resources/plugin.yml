main: dev.anchorlight.zander.hub.ZanderHubMain
name: zander-hub
version: ${project.version}
author: ModularSoft
api-version: 1.19
depend: [PremiumVanish, ProtocolLib]

commands:
  fly:
    description: Allows player to fly.
    usage: /fly
  connect:
    description: Connect to another server on the network.
    usage: /connect <server>
  zportal:
    description: Manage custom Hub portals.
    usage: /zportal <wand|create|delete|list|info|enable|disable|setserver|setlocation|setpermission|setdisplay|setcooldown|setsound|setstyle|setcolour|reload|tp|send> [args]
    aliases: [portaladmin]

permissions:
  zander.hub.fly:
    description: Use /fly in the hub.
    default: op
  zander.hub.build:
    description: Build and break blocks in the protected hub.
    default: op
  zanderhub.nether.bypass:
    description: Enter the Nether while it is disabled.
    default: op
  zanderhub.end.bypass:
    description: Enter the End while it is disabled.
    default: op
  zanderhub.portal.wand:
    default: op
  zanderhub.portal.create:
    default: op
  zanderhub.portal.delete:
    default: op
  zanderhub.portal.edit:
    default: op
  zanderhub.portal.list:
    default: op
  zanderhub.portal.reload:
    default: op
  zanderhub.portal.teleport:
    default: op
  zanderhub.portal.send:
    default: op
  zanderhub.portal.admin:
    description: Every /zportal permission.
    default: op
    children:
      zanderhub.portal.wand: true
      zanderhub.portal.create: true
      zanderhub.portal.delete: true
      zanderhub.portal.edit: true
      zanderhub.portal.list: true
      zanderhub.portal.reload: true
      zanderhub.portal.teleport: true
      zanderhub.portal.send: true
  zanderhub.administrator:
    description: Every zander-hub permission.
    default: op
    children:
      zander.hub.fly: true
      zander.hub.build: true
      zanderhub.nether.bypass: true
      zanderhub.end.bypass: true
      zanderhub.portal.admin: true
